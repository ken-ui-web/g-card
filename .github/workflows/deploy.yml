name: GitHub Pages に公開

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: ビルド
        shell: bash
        env:
          VITE_GAS_URL: ${{ vars.VITE_GAS_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_FIREBASE_CONFIG: ${{ vars.VITE_FIREBASE_CONFIG }}
          VITE_BUILD_VERSION: ${{ github.sha }}
        run: |
          export VITE_BUILD_DATE=$(TZ=Asia/Tokyo date +%-m/%-d)
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            export VITE_BASE_PATH=/
          else
            export VITE_BASE_PATH=/${{ github.event.repository.name }}/
          fi
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
